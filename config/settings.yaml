# AI-Editor settings
#
# Every value here is documented in docs/user-manual.md chapter 24 (Settings reference).
# Paths use forward slashes; Windows handles them fine.

folders:
  raw: F:/AI-Editor/raw # Twitch VOD downloads and OBS recordings
  cache: F:/AI-Editor/cache # Proxies, extracted audio, analysis working files
  output: F:/AI-Editor/output # Rendered videos, exported timelines, thumbnails
  assets: F:/AI-Editor/assets # Your music, SFX, fonts, overlays
  models: E:/AI-Editor/models # AI model files (Ollama manages its own)

tools:
  # Leave empty to find FFmpeg automatically. Set this to the folder holding
  # ffmpeg.exe only if the setup check cannot find it.
  ffmpeg_dir: null
  # Where helper programs such as the Twitch downloader are kept. Empty means a
  # "tools" folder next to your models folder.
  folder: null

performance:
  device: gpu # gpu | cpu. Leave on gpu.
  unload_models_between_steps: true # Spec section 3: only one large model in VRAM at a time
  proxy_resolution: 540 # Height in pixels of the fast preview copy
  proxy_fps: 30 # Frame rate of the preview copy. Final renders always use the original.
  ffmpeg_threads: 0 # 0 = let FFmpeg decide

queue:
  overnight_start_time: null # e.g. "02:00" to start the queue automatically
  shutdown_when_finished: false

companion:
  # Who catches the marker keys. obs = you bind them in OBS's own hotkey settings
  # (manual 7.4a): that keeps working inside games like League, which switch other
  # programs' hotkeys off while they're in front. windows = the Companion reserves
  # the two keys below itself.
  marker_keys: obs # obs | windows
  # Keys that mark a moment while you play (only used with marker_keys: windows). The Companion takes these keys over
  # while it runs, so games won't see them: pick keys your games don't use.
  # Windows cannot separate the numpad's Enter from the main Enter key, so that
  # one can't be used. Examples: numpad+, numpad-, f13-f24, ctrl+alt+m.
  mark_moment_hotkey: numpad+
  mark_short_hotkey: numpad-
  # A click when you mark. Keep it off: on 26 Sep it reached the stream through
  # the microphone (a stand-up mic hears your headphones), which no OBS setting
  # can reveal. It stays silent anyway while OBS captures Desktop Audio.
  confirmation_sound: false
  # How loud that click is, 0.05 to 1.0. Windows' own volume applies on top:
  # if it is still too quiet, check the volume mixer for Python.
  sound_volume: 0.9
  start_with_windows: false
  # Which game each OBS scene shows, for scenes whose name doesn't say it. Scenes
  # named after their game ("Wardogs", "Escape From Tarkov") need no entry.
  # Example:  scene_games: {"Scene 2": "Escape from Tarkov"}
  scene_games: {}
  # League of Legends: while a match runs, log your kills, deaths, multikills,
  # objectives and the result from League's own read-only Live Client Data API
  # on this PC (127.0.0.1:2999), each at its exact second in the recording.
  # No key or account; the game itself is never touched.
  league_events: true

obs:
  websocket_host: 127.0.0.1
  websocket_port: 4455
  # Leave this empty. Run "ai-editor setup-obs" instead: it saves the password to
  # config/settings.local.yaml, which stays on this PC and is never committed.
  websocket_password: ""

analysis:
  # faster-whisper model. large-v3 was clearly more accurate on the creator's speech than
  # large-v3-turbo ("OBS" not "a BS"; 17% fewer unclear words on EP 1) and still
  # transcribed 2 hours in 2.9 minutes. large-v3-turbo is the faster fallback.
  transcription_model: large-v3
  compute_type: float16
  # Split a single mixed audio track into voices and everything else before
  # analysing it. vods = Twitch VODs only (the spec); mixed = any recording with
  # one mixed track; off = never. Recordings with a separate mic track never need it.
  voice_separation: vods # vods | mixed | off
  signal_rate_hz: 1 # Signals are stored once per second (spec section 7.3)
  language: en # Language you speak on stream. "auto" detects it, a little slower.
  # Words the speech recognition mishears, and what you really said. Game and
  # friends' names it doesn't know come out as ordinary words that sound alike.
  # Add your own as  heard: meant  -- it takes effect on the next analyze,
  # without transcribing again.
  spellings:
    talk of: Tarkov
    tarkoff: Tarkov
    war dogs: Wardogs
    war dog's: Wardogs
  # Skip non-speech before transcribing? auto = only on a separate mic track, where
  # it's reliable. On a mixed track it misses speech under game music.
  voice_detector: auto # auto | on | off
  silence_threshold_db: -50 # Quieter than this counts as silence
  event_window_sec: 2 # Length of audio heard at once when listening for laughter, gunfire...
  scene_threshold: 5.0 # How different the picture must look to count as a scene change

scoring:
  # How much each thing lifts a moment's score (manual chapter 11.1b).
  # Your own markers count most, as the spec requires.
  weights:
    marker: 4.0
    marker_short: 4.0
    laughter: 2.5
    scream: 1.2
    chat_z: 1.2
    shout: 1.0
    energy_z: 0.5 # unusually loud for this recording
    explosion: 0.9
    gunfire: 0.8
    speech: 0.2 # someone is talking
    silence: -0.5 # dead air counts against a moment
    # League of Legends, from the game's own events (Stream Companion, manual 8.3):
    lol_kill: 1.0 # any kill of yours
    lol_multikill: 2.0 # double to penta: a penta counts fully
    lol_ace: 1.2 # your team aced them
    lol_objective: 1.0 # your team's Baron, Dragon, Herald...; steals count fully
    lol_death: 1.0 # your deaths, only when you react to them
    lol_fight: 0.8 # champions dying close together: a team fight
  # A marker is pressed after the good bit, so it lifts the minute before it.
  marker_lookback_sec: 60
  marker_lookahead_sec: 10
  # A League event lifts the fight leading up to it.
  event_lookback_sec: 12
  event_lookahead_sec: 3
  smooth_sec: 5 # how many seconds are judged together
  zscore_full_scale: 3.0 # how unusual loudness or chat has to be to count fully
  dark_level: 24 # a picture this dark (0-255) is a black screen: never a moment
  dark_min_sec: 10 # ...for at least this long: a loading screen. A shorter black (a crash, a death) is part of the moment
  # Sounds that only mean something when they keep going: one shot is someone
  # testing their gun, fifteen seconds of it is a firefight.
  sustain_sec:
    gunfire: 15
    explosion: 10
  # Added for each extra kind of thing happening at once (a fight AND a
  # reaction beats either alone). Set to 0 to score each signal on its own.
  combination_bonus: 1.2
  combination_threshold: 0.1 # low on purpose: the sound model hears laughter faintly

clips:
  # How the best moments become clips (manual chapter 11.1c).
  min_score: 0.2 # 1.0 = the recording's best moment
  core_fraction: 0.5 # the part of a peak above half its height is its core
  lead_in_sec: 30 # context before the moment: the build-up and the cause of the laugh
  tail_sec: 4 # after it, so the reaction can finish
  min_length_sec: 15
  max_length_sec: 90
  snap_sec: 6 # how far an edge may move to land on a pause or sentence end
  pause_sec: 0.5 # a gap in speech this long counts as a pause
  end_pause_sec: 1.0 # a clip only ends where you then stay quiet this long
  end_extend_sec: 10 # and may run this much longer to get there, so you're never cut off
  # Nor while a fight is still going: shooting at least fight_level that comes back
  # within fight_gap_sec is the same fight, followed for up to fight_extend_sec.
  fight_level: 0.2
  fight_gap_sec: 10
  fight_extend_sec: 30
  # A scene change only stops a clip if it stands alone (a menu, loading).
  # More than this many others within the window means cutscene camera work.
  scene_busy_count: 3
  scene_busy_window_sec: 30

lets_play: # Spec section 7.6 Recipe A
  # Games you record as Let's Play episodes. Their recordings are never used in
  # stream highlights, only in Let's Play videos.
  games: ["The Blood of Dawnwalker"]
  mode: split # split | condense
  target_min: 30
  normal_range_min: [25, 35]
  story_extension_preferred_max_min: 45
  story_extension_hard_max_min: 60
  trim_level: light # light | standard | tight
  # What the always-trim pass removes (nobody talking, nothing happening):
  dead_air_sec: 20 # silence longer than this is cut down...
  dead_air_keep_sec: 3 # ...keeping this much either side, so the jump isn't jarring
  loading_min_sec: 2 # a black screen this long is a loading screen
  still_level: 1.0 # a picture changing less than this is a menu, map or inventory...
  still_min_sec: 5 # ...cut after this long, unless you're talking over it
  hud_level: 0.15 # below this the game's HUD is hidden: a cutscene, never cut when quiet
  protect_score: 0.5 # moments scoring this well are never trimmed
  penalties:
    per_min_outside_normal_range: 1.0
    per_min_over_45: 4.0
    split_inside_story_mission: 50.0
    split_inside_cutscene_dialogue_fight: forbidden
  bonus_hook_ending: -5.0
  leftover:
    min_standalone_min: 15
    default_action: carry_to_next_session # carry_to_next_session | merge_into_previous
  recap_at_start: false
  recap_max_sec: 15
  hook_endings: true
  speedup_indicator: true
  tolerance_pct: 15 # A part counts as "on target" within +/- this percentage
  # Text over the first seconds of every part, e.g. "Ep {episode} – Part {part}"
  # ({episode} and {part} are filled in). Empty = no title card: the YouTube
  # title already says it.
  title_card: ""
  title_card_sec: 4

highlights: # Spec section 7.6 Recipe B
  target_length_min: 10
  # Quality bar: nothing below it goes in to fill time. Every Wardogs clip you
  # liked scored 0.56 or more; the first you rejected scored 0.54.
  min_clip_score: 0.55
  # When one stream runs out of good clips, carry on from the next:
  # oldest_first uses up the earliest stream first; best_first mixes freely.
  fill_order: oldest_first # oldest_first | best_first
  lead_in_sec: 15 # each clip is trimmed to this much before its moment...
  max_clip_sec: 50 # ...and no longer than this, so the video keeps its pace
  # timeline: clips in the order they happened, the teaser's moment saved for the
  # end. Or balanced (strong opener, calm/strong alternating), chronological, best_last.
  ordering: timeline
  hook: true # open with a teaser of the best moment
  hook_seconds: [5, 15]
  allow_reused_clips: false
  always_include_pinned: true
  always_include_markers: true

shorts: # Spec section 7.6 Recipe C
  min_length_sec: 15
  max_length_sec: 60
  lead_in_sec: 25 # Each Short opens this long before its moment, so the play your reaction is about stays in
  tail_sec: 3 # ...and runs this long after it, so the reaction finishes
  after_mark_sec: 5 # A Short from your mark (Numpad -) ends this long after the press...
  before_mark_sec: 45 # ...and opens up to this long before it
  per_recording: 5 # Shorts suggested per stream: your Numpad - marks first, then the AI's picks
  platform: universal # youtube_shorts | tiktok | universal: one file for all three
  preset: vertical_1080x1920_60 # One of render.presets
  # How the game fills the tall frame. crop: its centre, zoomed in to fill it.
  # fit: the whole picture, a blurred copy above and below. facecam_top: your
  # facecam above, the game below (needs the facecam marked, below).
  default_layout: crop
  layouts:
    The Blood of Dawnwalker: fit
  crop_centre: {} # Per game, where the crop sits left to right (0.5 = middle)
  # How much of the height the zoomed game fills (1 = all of it); the rest is the
  # blurred copy above and below. Lower = zoomed out, more of the game's sides kept.
  crop_fill: 0.75 # chosen 2026-10-05
  crop_fills: # Per game
    League of Legends: 0.65 # Its fights spread wide
  # Where your facecam is in the recording, per game, as shares of the picture:
  #   League of Legends: { x: 0.0, y: 0.7, w: 0.2, h: 0.3 }
  # None yet. A game with one uses facecam_top.
  facecam: {}
  facecam_share: 0.33 # Height of the facecam strip at the top of a Short
  captions: false # Burned-in captions: tick them per Short in Review
  follow_action: false
  hook: true
  must_make_sense_alone: true
  link_to_full_video: true
  spoiler_check_games: ["The Blood of Dawnwalker"]
  safe_zones: # Fractions of frame height/width kept clear of platform UI
    youtube_shorts: { bottom: 0.18, right: 0.14, top: 0.06 }
    tiktok: { bottom: 0.26, right: 0.20, top: 0.08 }
    universal: { bottom: 0.26, right: 0.20, top: 0.08 }

render:
  encoder: h264_nvenc # h264_nvenc | hevc_nvenc
  nvenc_preset: p5 # p1 fastest .. p7 best quality
  loudness_target_lufs: -14.0 # Suits YouTube playback loudness
  presets:
    youtube_1080p60: { width: 1920, height: 1080, fps: 60, bitrate: "16M" }
    youtube_1080p30: { width: 1920, height: 1080, fps: 30, bitrate: "12M" }
    vertical_1080x1920_60: { width: 1080, height: 1920, fps: 60, bitrate: "12M" }
    vertical_1080x1920_30: { width: 1080, height: 1920, fps: 30, bitrate: "10M" }
  preset: youtube_1080p60 # Which of the presets above a finished video uses
  # Friends on Discord in finished videos. Needs Discord on its own track in OBS
  # (manual 7.3); recordings with only a mixed track always have everything in.
  include_voice_chat: true
  # The music you play on stream (Spotify) in finished videos, lowered only where
  # it would cover someone talking (manual 19.2e). Use DMCA-free music: commercial
  # music usually gets a YouTube video claimed. Each video can switch it off in Review.
  include_stream_music: true

effects: # On the big moments, placed by AI-Editor (manual 19.2d). Each video can switch its own in Review.
  # Which are on, per kind of video: flash, shake (screen shake), sfx (sound effects).
  # Off until League's own events place them (Phase 2E); tick them per video in Review.
  highlights: []
  shorts: []
  lets_play: []
  # One per moment you marked with the Stream Companion; at most this many per minute.
  highlights_per_min: 1.5
  shorts_per_min: 3.0
  lets_play_per_min: 0.75
  min_gap_sec: 6.0
  sfx_volume_db: -3.0 # Sound effects against the moment they're on
  between_clips: cut # Highlights: cut | slide (the next clip slides in over the last)
  flash_strength: 0.35 # 1 would be a white screen
  shake_strength: 0.02 # How far the picture moves, as a share of its height

captions:
  # Your words burned into finished videos (manual 19.2c). Off unless you turn
  # them on here, or for one video with: ai-editor render <plan> --captions
  highlights: false
  lets_play: false
  font: Arial
  size: 64 # Letter height in pixels on a 1080p picture
  bold: true
  outline: 4 # Black edge around the letters, in pixels
  # How far up from the bottom, as a share of the picture's height. Let's Plays
  # sit higher, above the game's own subtitles (Dawnwalker's are 9-15% up).
  position:
    highlights: 0.12
    lets_play: 0.22
  # Shorts: a few words at a time, the word being said in this colour
  shorts_size: 88 # Letter height in pixels on a 1920-high picture
  shorts_words: 3 # Words on screen at once, at most
  shorts_highlight: "#FFD400"

storage:
  low_space_warning_gb: 100

twitch:
  # Twitch deletes VODs after 7 days (regular), 14 (Affiliates) or 60 (Partners,
  # Turbo, Prime). AI-Editor warns when one is close to going.
  vod_keep_days: 14
  download_quality: 1080p60
  # Chat bots post automatically ("...is now live!"), so their messages never
  # count as viewers reacting. Add any other bot your channel uses.
  ignore_chatters: [StreamElements, Nightbot, Moobot, Streamlabs, Fossabot, Sery_Bot, WizeBot, SoundAlerts]

llm: # The local AI, through Ollama (manual 6.3). Nothing is sent online.
  enabled: true # false: AI-Editor works as before, without the AI's judgement
  model: gemma4:12b # Reads text and looks at pictures; about 8 GB, downloaded once
  host: http://127.0.0.1:11434 # Ollama on this PC (nothing else is allowed)
  keep_alive: 0 # Free VRAM immediately after each stage (spec section 3)
  temperature: 0.2 # Low: the same clip gets the same rating each time
  rating_weight: 0.0 # Share of a clip's score that is the AI's rating. 0: shown, not used to pick
  frames_per_clip: 3 # Pictures from each clip the AI looks at

publish: # Titles, description, chapters and thumbnails for each video (manual 20)
  # Let's Play titles: the AI writes {subtitle}; the rest stays the same every part.
  lets_play_title: "{game} - EP {episode} Part {part}: {subtitle}"
  # Added under every description, e.g. "Live on Twitch: twitch.tv/yourname"
  description_footer: ""
  thumbnails: 6 # Frames kept, best first (output/thumbnails)
  chapter_every_min: 5 # A Let's Play part gets a chapter about this often

logging:
  # What appears on screen. The log file always records everything.
  level: WARNING # DEBUG | INFO | WARNING | ERROR
