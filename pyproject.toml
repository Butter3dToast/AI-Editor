[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-editor"
version = "0.1.0"
description = "AI-Editor - a local assistant editor that turns stream and Let's Play recordings into YouTube content"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-editor = "ai_editor.cli:app"

[tool.setuptools.packages.find]
include = ["ai_editor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
