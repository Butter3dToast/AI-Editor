[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-editor"
version = "0.5.0"
description = "AI-Editor - a local assistant editor that turns stream and Let's Play recordings into YouTube content"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.6",
    "numpy>=1.26",
    "soundfile>=0.12",
    # Transcription (spec section 4). Runs on CTranslate2, which needs the
    # CUDA 12 cuBLAS/cuDNN libraries that the CUDA 12 build of torch provides.
    "faster-whisper>=1.1",
    # Sound event detection (PANNs Cnn14, see ai_editor/analysis/panns_cnn14.py).
    # Install torch from the CUDA 12 index FIRST, or pip picks the CPU-only build:
    #   pip install torch --index-url https://download.pytorch.org/whl/cu126
    "torch>=2.4",
    "torchlibrosa>=0.1",
    # Voice separation for single mixed tracks (spec section 7.3).
    "demucs>=4.1",
    # Stream Companion's connection to OBS (spec section 7.1).
    "websocket-client>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-editor = "ai_editor.cli:app"

[tool.setuptools.packages.find]
include = ["ai_editor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
